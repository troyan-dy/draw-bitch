# flake8 читает только setup.cfg/tox.ini/.flake8 — не pyproject. Здесь только WPS
# (wemake-python-styleguide); базовый линт и импорты — за ruff (pyproject.toml).
[flake8]
select = WPS
max-line-length = 100
exclude = .venv,.git,__pycache__,.mypy_cache,.pytest_cache,.ruff_cache,build,dist

per-file-ignores =
    # Lobby — единая машина состояний игры (см. CLAUDE.md): методы = её операции,
    # дробление класса ради лимита в 7 методов поменяло бы архитектуру.
    app/game/lobby.py: WPS214
    # Модуль Pydantic-схем: по классу на тип WS-сообщения, лимит членов модуля не про это.
    app/schemas.py: WPS202
    # WS-транспорт (не покрыт unit-тестами, см. coverage omit):
    # WPS430 — FastAPI регистрирует хендлер декоратором внутри register_ws;
    # WPS476 — рассылка намеренно последовательная, чтобы сохранить порядок сообщений;
    # WPS213/217/223/231/214 — диспетчер сообщений и жизненный цикл соединения;
    # переписывать без тестов на транспорт — риск поменять поведение.
    app/ws.py: WPS213, WPS214, WPS217, WPS223, WPS231, WPS430, WPS476
    # Тесты: короткие имена игроков (a, b), магические значения и литералы в
    # assert-ах, повторяющиеся сценарии — это читаемость тестов, а не дефекты.
    tests/*.py: WPS110, WPS111, WPS118, WPS202, WPS204, WPS210, WPS221, WPS226, WPS358, WPS432, WPS459, WPS520
