[project]
name = "draw-bitch"
version = "0.1.0"
description = "Реалтайм-игра «рисуй и угадывай» для игры с друзьями"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "wemake-python-styleguide>=1.8.1",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["app"]
# Транспорт и точка входа покрываются вручную/интеграционно, а не unit-тестами.
omit = ["app/main.py", "app/ws.py", "app/logging_setup.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.14"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
